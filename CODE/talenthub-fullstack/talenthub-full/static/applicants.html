<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs & applicants · TalentHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="applicants"><main class="wrap"><h1 style="font-size:2rem">Jobs and applicants</h1><form class="card" id="pf" style="max-width:none;margin:0 0 1.5rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end"><label>Role<input name="role" required></label><label>Package (LPA)<input name="package_lpa" type="number" step="0.1" placeholder="8" required></label><label>Min CGPA<input name="min_cgpa" type="number" step="0.1" required></label><label>Branches (Ctrl-click for many)<select name="branches" multiple required><option>CSE</option><option>ECE</option><option>EEE</option><option>ME</option></select></label><button class="btn dk">Post job</button></form>
