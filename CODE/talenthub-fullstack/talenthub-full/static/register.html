<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · TalentHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="register"><main class="wrap"><form class="card" id="f"><h2>Create student account</h2><label>Email<input name="email" type="email" required></label><label>Password (6+ characters)<input name="password" type="password" minlength="6" required></label><label>Full name<input name="name" required></label><label>USN<input name="usn" required></label><label>Branch<select name="branch"><option>CSE</option><option>ECE</option><option>EEE</option><option>ME</option></select></label><label>CGPA<input name="cgpa" type="number" step="0.01" min="0" max="10" required></label><label>Active backlogs<input name="backlogs" type="number" min="0" value="0" required></label><button class="btn dk">Create account</button></form></main><script src="app.js"></script></body></html>
